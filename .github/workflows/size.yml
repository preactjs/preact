name: Compressed Size

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: '.node-version'
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          # compressed-size-action installs dependencies itself.
          run-install: false
      - uses: preactjs/compressed-size-action@66325aad6443cb7cf89c4bfcd414aea2367cda94 # 2.9.1
        with:
          repo-token: '${{ secrets.GITHUB_TOKEN }}'
          build-script: 'build'
