name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - main
      - restructure
      - v11

permissions:
  contents: read

jobs:
  filter_jobs:
    name: Filter jobs
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      # dorny/paths-filter lists the changed files of a PR through the API
      pull-requests: read
    outputs:
      jsChanged: ${{ steps.filter.outputs.jsChanged }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          # Should be kept in sync with the filter in the PR Reporter workflow
          predicate-quantifier: 'every'
          filters: |
            jsChanged:
              - '**/src/**/*.js'
              - '!devtools/src/devtools.js'

  compressed_size:
    name: Compressed Size
    needs: filter_jobs
    if: ${{ needs.filter_jobs.outputs.jsChanged == 'true' }}
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/size.yml

  build_test:
    name: Build & Test
    needs: filter_jobs
    uses: ./.github/workflows/build-test.yml

  benchmarks:
    name: Benchmarks
    needs: build_test
    if: ${{ needs.filter_jobs.outputs.jsChanged == 'true' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/benchmarks.yml
