name: Build & Test

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Branch or tag ref to check out'
        type: string
        required: false
        default: ''
      artifact_name:
        description: 'Name of the artifact to upload'
        type: string
        required: false
        default: 'npm-package'

permissions:
  contents: read

jobs:
  build_test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref || '' }}
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: '.node-version'
          # The main build artifact is used for publishing, so avoid cached dependencies.
          cache: ${{ github.ref != 'refs/heads/main' }}
          cache-dependency-path: pnpm-lock.yaml
          run-install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: test
        env:
          CI: true
          COVERAGE: true
          FLAKEY: false
        run: pnpm run lint && pnpm run test:unit
      - name: Coveralls GitHub Action
        uses: coverallsapp/github-action@5cbfd81b66ca5d10c19b062c04de0199c215fb6e # v2.3.7
        timeout-minutes: 2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fail-on-error: false
      - name: Package
        # Package the tested build without running pack lifecycle scripts.
        run: |
          pnpm pack --config.ignore-scripts=true
          mv preact-*.tgz preact.tgz
      - name: Upload npm package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name || 'npm-package' }}
          path: preact.tgz
